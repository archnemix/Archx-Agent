# Purpose: Builds and tests ONE app on its own, so several apps can be in progress at once without waiting on the shared release.
# This job is a harness, not a release: it proves an app compiles, its tests pass,
# and (where the harness can render it) that it is hosted. Nothing it builds is
# published. Publishing is `src/main.rs::release()` plus one workspace member.
name: App harness

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App folder id under apps/ (e.g. training, archx-agent)'
        required: true
        default: 'archx-agent'
        type: string
      windows:
        description: 'Also build and test on Windows'
        type: boolean
        default: false
  push:
    # `app/**` is the branch shape the hand-off asks for. `arena/*` is what an
    # Arena session branch is actually called (`arena/<uuid>-archx-agent`), and
    # the author cannot rename it — without this pattern their push triggered
    # nothing at all, so there was no way to get a green build on their branch.
    branches: [arena/53d9bc26-archx-agent, 'app/**', 'arena/*']
    paths:
      - 'apps/**'
      - 'shared/**'
      - '.github/workflows/app-harness.yml'

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The branch that triggered the run. A fixed ref meant an app author's
          # own branch was never built: the job would test the main line instead
          # and report on code the author had not written yet.
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and test the app in isolation
        shell: bash
        env:
          # A dispatch run names the app; a push run passes nothing and the step
          # below works it out from the commit. There is deliberately no default:
          # a wrong default would report PASS for code nobody wrote.
          APP: ${{ inputs.app }}
        run: |
          set -o pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libasound2-dev xvfb > /dev/null
          # Which app? Three signals, in order, and never a guess:
          #   1. a dispatch run says so;
          #   2. branch `app/<id>-<who>` names it (the shape the hand-off asks for);
          #   3. otherwise diff against the launcher branch and take the one app
          #      folder that changed. Arena fixes the session branch name
          #      (`arena/<uuid>-archx-agent`), so an author there cannot use
          #      `app/...`; this is the case that keeps their run meaningful.
          # If none of them identifies exactly one app, the job stops with SKIP.
          LAUNCHER_REF="origin/arena/53d9bc26-archx-agent"
          if [ -z "$APP" ]; then
            case "$GITHUB_REF_NAME" in
              app/*-*) APP="${GITHUB_REF_NAME#app/}"; APP="${APP%-*}" ;;
            esac
          fi
          if [ -z "$APP" ]; then
            git fetch --quiet origin "+refs/heads/arena/53d9bc26-archx-agent:refs/remotes/$LAUNCHER_REF" 2>/dev/null || true
            # `awk NF` rather than `grep`: a runner runs this under `bash -e`,
            # and `grep -c`/`grep -v` exit 1 when nothing matched, which would
            # kill the step on the branch where no app folder changed at all.
            if BASE="$(git merge-base "$LAUNCHER_REF" HEAD 2>/dev/null)"; then
              CHANGED="$(git diff --name-only "$BASE" HEAD -- 'apps/' | cut -d/ -f2 | awk 'NF' | sort -u)"
              COUNT="$(printf '%s\n' "$CHANGED" | awk 'NF' | wc -l)"
              if [ "$COUNT" = "1" ]; then APP="$CHANGED"; fi
            fi
          fi
          if [ -z "$APP" ]; then
            echo "SKIP: this push does not identify exactly one app folder."
            echo "Push to app/<id>-<name>, or dispatch this workflow with 'app' set." | tee -a app-harness.log
            exit 0
          fi
          LOG="apps/$APP/docs/Test_Results/Unreleased/non_visual/app-harness.log"
          mkdir -p "apps/$APP/docs/Test_Results/Unreleased/non_visual" "apps/$APP/docs/Test_Results/Unreleased/visual"
          : > "$LOG"
          # The manifest is the entry point: if it is not there, there is nothing
          # to harness, and the job says so instead of guessing a crate name.
          test -f "apps/$APP/app.toml" || { echo "no apps/$APP/app.toml" | tee -a "$LOG"; exit 1; }
          # The app id is a FOLDER name (`training`); the crate is declared in the
          # manifest (`crate = "archx-training"`). `cargo -p` wants the crate, so
          # read it from the manifest instead of assuming id == crate name, which
          # only ever worked because `archx-agent` begins with `archx-`.
          CRATE="$(sed -n 's/^[[:space:]]*crate[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "apps/$APP/app.toml" | head -1)"
          if [ -z "$CRATE" ]; then
            echo "SKIP: apps/$APP/app.toml declares no crate, so there is nothing to build yet." | tee -a "$LOG"
            echo "This is correct for a reserved app. Add \`crate = \"archx-$APP\"\` when the code lands." | tee -a "$LOG"
            exit 0
          fi
          echo "APP: $APP  CRATE: $CRATE" | tee -a "$LOG"
          {
            echo "COMMAND: cargo test -p $CRATE"
            cargo test -p "$CRATE" --locked 2>&1 || cargo test -p "$CRATE" 2>&1
            echo "COMMAND: cargo build -p $CRATE"
            cargo build -p "$CRATE"
          } | tee -a "$LOG"
          # The app's crate built. The launcher is NOT built here: an app in
          # progress is not in the release, and the harness must never pretend it is.
          echo "PASS: $APP builds and its own tests pass in isolation" | tee -a "$LOG"
      - name: Render the held app, if the harness can host it
        shell: bash
        env:
          # A dispatch run names the app; a push run passes nothing and the step
          # below works it out from the commit. There is deliberately no default:
          # a wrong default would report PASS for code nobody wrote.
          APP: ${{ inputs.app }}
        run: |
          # Which app? Three signals, in order, and never a guess:
          #   1. a dispatch run says so;
          #   2. branch `app/<id>-<who>` names it (the shape the hand-off asks for);
          #   3. otherwise diff against the launcher branch and take the one app
          #      folder that changed. Arena fixes the session branch name
          #      (`arena/<uuid>-archx-agent`), so an author there cannot use
          #      `app/...`; this is the case that keeps their run meaningful.
          # If none of them identifies exactly one app, the job stops with SKIP.
          LAUNCHER_REF="origin/arena/53d9bc26-archx-agent"
          if [ -z "$APP" ]; then
            case "$GITHUB_REF_NAME" in
              app/*-*) APP="${GITHUB_REF_NAME#app/}"; APP="${APP%-*}" ;;
            esac
          fi
          if [ -z "$APP" ]; then
            git fetch --quiet origin "+refs/heads/arena/53d9bc26-archx-agent:refs/remotes/$LAUNCHER_REF" 2>/dev/null || true
            # `awk NF` rather than `grep`: a runner runs this under `bash -e`,
            # and `grep -c`/`grep -v` exit 1 when nothing matched, which would
            # kill the step on the branch where no app folder changed at all.
            if BASE="$(git merge-base "$LAUNCHER_REF" HEAD 2>/dev/null)"; then
              CHANGED="$(git diff --name-only "$BASE" HEAD -- 'apps/' | cut -d/ -f2 | awk 'NF' | sort -u)"
              COUNT="$(printf '%s\n' "$CHANGED" | awk 'NF' | wc -l)"
              if [ "$COUNT" = "1" ]; then APP="$CHANGED"; fi
            fi
          fi
          if [ -z "$APP" ]; then
            echo "SKIP: this push does not identify exactly one app folder."
            echo "Push to app/<id>-<name>, or dispatch this workflow with 'app' set." | tee -a app-harness.log
            exit 0
          fi
          if [ -z "$APP" ]; then exit 0; fi
          LOG="apps/$APP/docs/Test_Results/Unreleased/non_visual/app-harness.log"
          # Rendering needs the launcher, and the launcher only builds a release.
          # So the harness renders only when the app is in the release AND ready.
          # The projection is an app id (`ARCHX_SNAPSHOT_APPS=<id>`), which is
          # what `src/main.rs::projection()` reads — not JSON. It can only mark an
          # app that already has a manifest and a release line, so a checked-in
          # app is never published by this job.
          if grep -q "\"apps/$APP\"" Cargo.toml && grep -q "register(\"$APP\")" src/main.rs; then
            cargo build --release -p archx-ai-lab >> "$LOG" 2>&1
            PNG="apps/$APP/docs/Test_Results/Unreleased/visual/app-harness.png"
            rm -f "$PNG"
            xvfb-run -a env ARCHX_SNAPSHOT_APPS="$APP" ARCHX_SNAPSHOT="$PNG" \
              ./target/release/archx-ai-lab >> "$LOG" 2>&1
            # A screenshot alone proves nothing: the launcher writes one for
            # whatever it shows. Fail unless the app under test actually made it
            # into the image's build, which is what the projection is for.
            if [ ! -s "$PNG" ]; then
              echo "FAIL: the launcher produced no screenshot for $APP" | tee -a "$LOG"
              exit 1
            fi
            if ! grep -q "release-discover: $APP built" "$LOG"; then
              echo "FAIL: $APP was not in the launcher's projection; the screenshot does not show it." | tee -a "$LOG"
              exit 1
            fi
            echo "PASS: $APP renders inside the harness launcher" | tee -a "$LOG"
          else
            echo "SKIP: $APP is not in this release (no workspace member or no register line), so the launcher cannot host it. Its own build above is the evidence." | tee -a "$LOG"
          fi
      - name: Record the result in the repository
        shell: bash
        run: |
          git config user.name "archx-ci"
          git config user.email "ci@archnemic.local"
          git add apps/*/docs/Test_Results 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Record app harness result for ${{ inputs.app || 'archx-agent' }}"
          # Results are recorded on the branch the run came from — which for an
          # app under development is that app's own branch, never the main line.
          BRANCH="${GITHUB_REF_NAME}"
          if ! git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
            echo "Not a branch on the remote ($BRANCH); results are in this run's log only."
            exit 0
          fi
          git pull --rebase origin "$BRANCH" || true
          git push origin "HEAD:$BRANCH" || true

  windows:
    if: ${{ inputs.windows == true }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The branch that triggered the run. A fixed ref meant an app author's
          # own branch was never built: the job would test the main line instead
          # and report on code the author had not written yet.
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and test the app in isolation
        shell: bash
        env:
          # A dispatch run names the app; a push run passes nothing and the step
          # below works it out from the commit. There is deliberately no default:
          # a wrong default would report PASS for code nobody wrote.
          APP: ${{ inputs.app }}
        run: |
          # Which app? Three signals, in order, and never a guess:
          #   1. a dispatch run says so;
          #   2. branch `app/<id>-<who>` names it (the shape the hand-off asks for);
          #   3. otherwise diff against the launcher branch and take the one app
          #      folder that changed. Arena fixes the session branch name
          #      (`arena/<uuid>-archx-agent`), so an author there cannot use
          #      `app/...`; this is the case that keeps their run meaningful.
          # If none of them identifies exactly one app, the job stops with SKIP.
          LAUNCHER_REF="origin/arena/53d9bc26-archx-agent"
          if [ -z "$APP" ]; then
            case "$GITHUB_REF_NAME" in
              app/*-*) APP="${GITHUB_REF_NAME#app/}"; APP="${APP%-*}" ;;
            esac
          fi
          if [ -z "$APP" ]; then
            git fetch --quiet origin "+refs/heads/arena/53d9bc26-archx-agent:refs/remotes/$LAUNCHER_REF" 2>/dev/null || true
            # `awk NF` rather than `grep`: a runner runs this under `bash -e`,
            # and `grep -c`/`grep -v` exit 1 when nothing matched, which would
            # kill the step on the branch where no app folder changed at all.
            if BASE="$(git merge-base "$LAUNCHER_REF" HEAD 2>/dev/null)"; then
              CHANGED="$(git diff --name-only "$BASE" HEAD -- 'apps/' | cut -d/ -f2 | awk 'NF' | sort -u)"
              COUNT="$(printf '%s\n' "$CHANGED" | awk 'NF' | wc -l)"
              if [ "$COUNT" = "1" ]; then APP="$CHANGED"; fi
            fi
          fi
          if [ -z "$APP" ]; then
            echo "SKIP: this push does not identify exactly one app folder."
            echo "Push to app/<id>-<name>, or dispatch this workflow with 'app' set." | tee -a app-harness.log
            exit 0
          fi
          LOG="apps/$APP/docs/Test_Results/Unreleased/non_visual/app-harness-windows.log"
          mkdir -p "apps/$APP/docs/Test_Results/Unreleased/non_visual"
          : > "$LOG"
          test -f "apps/$APP/app.toml" || { echo "no apps/$APP/app.toml" | tee -a "$LOG"; exit 1; }
          CRATE="$(sed -n 's/^[[:space:]]*crate[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "apps/$APP/app.toml" | head -1)"
          if [ -z "$CRATE" ]; then
            echo "SKIP: apps/$APP/app.toml declares no crate, so there is nothing to build yet." | tee -a "$LOG"
            exit 0
          fi
          echo "APP: $APP  CRATE: $CRATE" | tee -a "$LOG"
          cargo test -p "$CRATE" 2>&1 | tee -a "$LOG"
          cargo build -p "$CRATE" 2>&1 | tee -a "$LOG"
          echo "PASS: $APP builds and its own tests pass on Windows" | tee -a "$LOG"
