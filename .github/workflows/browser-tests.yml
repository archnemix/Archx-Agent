name: browser-tests

# Triggered by editing the sentinel file, so a run costs one tiny commit and
# never fires on ordinary source pushes.
on:
  workflow_dispatch:
  push:
    paths:
      - 'tests/ci/run-browser-tests'

permissions:
  contents: write

concurrency:
  group: browser-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- API suite
  api:
    name: API contract (node)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run API tests
        run: |
          mkdir -p test-output/api-results
          node --test --test-reporter=spec "tests/api/**/*.test.mjs" > test-output/api-results/api.log 2>&1 || EXIT=$?
          tail -40 test-output/api-results/api.log
          if [ "${EXIT:-0}" != "0" ]; then
            echo "api" > test-output/api-results/failed-suites.txt
            echo "::error::API suite failed"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-results
          path: test-output/
          retention-days: 3

  # ------------------------------------------------- visual tour, per viewport
  visual:
    name: Visual tour (${{ matrix.viewport }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        viewport: [desktop, laptop, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install app dependencies
        run: npm ci --no-audit --no-fund
      - name: Install browser harness
        working-directory: tests/ci
        run: npm ci --no-audit --no-fund
      - name: Run the ${{ matrix.viewport }} tour
        env:
          BROWSER_TESTS: '1'
          TEST_VIEWPORT: ${{ matrix.viewport }}
          ARTIFACT_DIR: test-output/${{ matrix.viewport }}
        run: |
          mkdir -p "test-output/${{ matrix.viewport }}"
          node --test --test-reporter=spec tests/browser/visual-tour.test.mjs \
            > "test-output/${{ matrix.viewport }}/visual.log" 2>&1 || EXIT=$?
          tail -30 "test-output/${{ matrix.viewport }}/visual.log"
          if [ "${EXIT:-0}" != "0" ]; then
            echo "visual-${{ matrix.viewport }}" > "test-output/${{ matrix.viewport }}/failed-suites.txt"
            echo "::error::visual tour failed for ${{ matrix.viewport }}"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-${{ matrix.viewport }}
          path: test-output/${{ matrix.viewport }}/
          retention-days: 3

  # ------------------------------------------------------- interaction tests
  interaction:
    name: Interaction + hit-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install app dependencies
        run: npm ci --no-audit --no-fund
      - name: Install browser harness
        working-directory: tests/ci
        run: npm ci --no-audit --no-fund
      - name: Run interaction suite
        env:
          BROWSER_TESTS: '1'
          ARTIFACT_DIR: test-output/interaction
        run: |
          mkdir -p test-output/interaction
          node --test --test-reporter=spec tests/browser/interaction.test.mjs \
            > test-output/interaction/interaction.log 2>&1 || EXIT=$?
          tail -40 test-output/interaction/interaction.log
          if [ "${EXIT:-0}" != "0" ]; then
            echo "interaction" > test-output/interaction/failed-suites.txt
            echo "::error::interaction suite failed"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interaction
          path: test-output/interaction/
          retention-days: 3

  # ------------------------------------------------------------ publish back
  publish:
    name: Publish results into the repo
    needs: [api, visual, interaction]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Download every result bundle
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: /tmp/results

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Assemble test-output/
        run: |
          rm -rf test-output
          mkdir -p test-output
          # artifact folders nest as <artifact-name>/<files>; flatten the logs
          if [ -d /tmp/results ]; then cp -r /tmp/results/. test-output/ 2>/dev/null || true; fi
          # each bundle drops its own marker; the summary reads them all
          cat test-output/*/failed-suites.txt 2>/dev/null > test-output/failed-suites.txt || true
          rm -f test-output/*/failed-suites.txt
          find test-output -maxdepth 2 -type f | sort | head -80

      - name: Write the run summary
        run: node tests/ci/summarize.mjs "${{ github.run_id }}" "${{ github.run_number }}" "${{ github.sha }}" || true

      - name: Record the job outcomes
        run: |
          cat > "test-output/jobs-${{ github.run_id }}.json" <<'JSON'
          ${{ toJSON(needs) }}
          JSON
          node -e "
            const fs = require('fs');
            const jobs = JSON.parse(fs.readFileSync('test-output/jobs-${{ github.run_id }}.json', 'utf8'));
            const lines = ['# Job outcomes', ''];
            for (const [name, info] of Object.entries(jobs)) lines.push(\`- **\${name}**: \${info.result}\`);
            fs.appendFileSync('test-output/SUMMARY.md', '\n' + lines.join('\n') + '\n');
            const failed = Object.entries(jobs).filter(([, i]) => i.result !== 'success');
            if (failed.length) fs.appendFileSync('test-output/failed-suites.txt', failed.map(([n]) => n + ' (job ' + jobs[n].result + ')').join('\n') + '\n');
          "

      - name: Commit results back to the branch
        id: commit
        run: |
          git config user.name  "archx-test-bot"
          git config user.email "archx-test-bot@users.noreply.github.com"
          git add -A -f test-output
          if git diff --cached --quiet; then
            echo "no result changes — nothing to commit"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -q -m "test: results for run ${{ github.run_number }} [skip ci]"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${{ github.ref_name }}"; then
              echo "committed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push attempt $attempt failed — rebasing onto the remote and retrying"
            git pull --rebase --autostash origin "${{ github.ref_name }}" || true
            sleep 5
          done
          echo "committed=false" >> "$GITHUB_OUTPUT"
          echo "::error::could not push results — the workflow token is probably read-only for this repo"
          exit 1

      - name: Fail the run if a suite failed
        run: |
          if [ -s test-output/failed-suites.txt ]; then
            echo "Failed suites:"
            cat test-output/failed-suites.txt
            exit 1
          fi
