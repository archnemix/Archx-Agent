# Purpose: Builds, tests, screenshots, and records the native GUI on Linux, Windows, and macOS.
name: Desktop GUI review

on:
  push:
    branches: [arena/53d9bc26-archx-agent]
    paths:
      - 'src/**'
      - 'shared/**'
      - 'apps/**'
      - 'build.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/gui.yml'
      - 'internels/ci-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  real-smol:
    uses: ./.github/workflows/smol-wrapper.yml

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/53d9bc26-archx-agent
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Build, test, and screenshot
        shell: bash
        run: |
          set -o pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libasound2-dev xvfb > /dev/null
          mkdir -p apps/archx-agent/docs/Test_Results/Unreleased/{non_visual,visual}
          cargo generate-lockfile > apps/archx-agent/docs/Test_Results/Unreleased/non_visual/linux.log 2>&1
          (echo 'COMMAND: cargo test --workspace --locked'; cargo test --workspace --locked && echo 'COMMAND: cargo build --release --locked' && cargo build --release --locked -p archx-ai-lab) >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/linux.log 2>&1
          echo 'COMMAND: isolated synthetic cache RSS review' >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/linux.log
          ARCHX_ISOLATED_RSS_TEST=1 cargo test --locked -p archx-agent synthetic_cache_rss_review -- --nocapture --test-threads=1 >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/linux.log 2>&1
          xvfb-run -a env ARCHX_SNAPSHOT=apps/archx-agent/docs/Test_Results/Unreleased/visual/linux.png ./target/release/archx-ai-lab >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/linux.log 2>&1
          test -s apps/archx-agent/docs/Test_Results/Unreleased/visual/linux.png
          for phase in 1 3; do
            xvfb-run -a env ARCHX_SNAPSHOT_AGENT_PHASE=$phase ARCHX_SNAPSHOT=apps/archx-agent/docs/Test_Results/Unreleased/visual/linux-agent-phase-$phase.png ./target/release/archx-ai-lab >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/linux.log 2>&1
            test -s apps/archx-agent/docs/Test_Results/Unreleased/visual/linux-agent-phase-$phase.png
            if cmp -s apps/archx-agent/docs/Test_Results/Unreleased/visual/linux.png apps/archx-agent/docs/Test_Results/Unreleased/visual/linux-agent-phase-$phase.png; then echo "FAIL: Linux Agent phase $phase matches rest" >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/linux.log; exit 1; fi
            echo "PASS: Linux Agent phase $phase differs from rest" >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/linux.log
          done
          for phase in 1 2; do
            xvfb-run -a env ARCHX_SNAPSHOT_HOVER=archx-agent ARCHX_SNAPSHOT_PHASE=$phase ARCHX_SNAPSHOT=apps/archx-agent/docs/Test_Results/Unreleased/visual/linux-agent-hover-$phase.png ./target/release/archx-ai-lab >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/linux.log 2>&1
            test -s apps/archx-agent/docs/Test_Results/Unreleased/visual/linux-agent-hover-$phase.png
          done
          if cmp -s apps/archx-agent/docs/Test_Results/Unreleased/visual/linux.png apps/archx-agent/docs/Test_Results/Unreleased/visual/linux-archx-agent-hover-1.png; then echo "FAIL: Linux tile hover matches rest" >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/linux.log; exit 1; fi
          echo "PASS: Linux tile hover differs from rest" >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/linux.log
          xvfb-run -a env ARCHX_SNAPSHOT_PAGE=about ARCHX_SNAPSHOT=apps/archx-agent/docs/Test_Results/Unreleased/visual/linux-about.png ./target/release/archx-ai-lab >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/linux.log 2>&1
          test -s apps/archx-agent/docs/Test_Results/Unreleased/visual/linux-about.png
          xvfb-run -a env ARCHX_SNAPSHOT_PAGE=agent ARCHX_SNAPSHOT=apps/archx-agent/docs/Test_Results/Unreleased/visual/linux-agent.png ./target/release/archx-ai-lab >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/linux.log 2>&1
          test -s apps/archx-agent/docs/Test_Results/Unreleased/visual/linux-agent.png
          xvfb-run -a env ARCHX_SNAPSHOT_PAGE=agent ARCHX_SNAPSHOT_DRAFT='Sketch a new idea for a project' ARCHX_SNAPSHOT=apps/archx-agent/docs/Test_Results/Unreleased/visual/linux-agent-draft.png ./target/release/archx-ai-lab >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/linux.log 2>&1
          xvfb-run -a env ARCHX_SNAPSHOT_PAGE=agent ARCHX_SNAPSHOT_CHAT=reasoning ARCHX_SNAPSHOT=apps/archx-agent/docs/Test_Results/Unreleased/visual/linux-agent-markdown.png ./target/release/archx-ai-lab >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/linux.log 2>&1
          test -s apps/archx-agent/docs/Test_Results/Unreleased/visual/linux-agent-markdown.png
          xvfb-run -a env ARCHX_SNAPSHOT_PAGE=agent ARCHX_SNAPSHOT_SIZE=wide ARCHX_SNAPSHOT_CHAT=reasoning ARCHX_SNAPSHOT=apps/archx-agent/docs/Test_Results/Unreleased/visual/linux-chat-wide.png ./target/release/archx-ai-lab >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/linux.log 2>&1
          xvfb-run -a env ARCHX_SNAPSHOT_PAGE=agent ARCHX_SNAPSHOT_SIZE=wide ARCHX_SNAPSHOT_CHAT=model-menu ARCHX_SNAPSHOT=apps/archx-agent/docs/Test_Results/Unreleased/visual/linux-model-menu.png ./target/release/archx-ai-lab >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/linux.log 2>&1
          test -s apps/archx-agent/docs/Test_Results/Unreleased/visual/linux-chat-wide.png
          test -s apps/archx-agent/docs/Test_Results/Unreleased/visual/linux-model-menu.png
          xvfb-run -a env ARCHX_SNAPSHOT_PAGE=agent ARCHX_SNAPSHOT_SIZE=wide ARCHX_SNAPSHOT_CHAT=review ARCHX_SNAPSHOT=apps/archx-agent/docs/Test_Results/Unreleased/visual/linux-chat-review.png ./target/release/archx-ai-lab >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/linux.log 2>&1
          test -s apps/archx-agent/docs/Test_Results/Unreleased/visual/linux-chat-review.png
          xvfb-run -a env ARCHX_SNAPSHOT_PAGE=agent ARCHX_SNAPSHOT_SIZE=wide ARCHX_SNAPSHOT_CHAT=conversation-review ARCHX_SNAPSHOT=apps/archx-agent/docs/Test_Results/Unreleased/visual/linux-conversation-review.png ./target/release/archx-ai-lab >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/linux.log 2>&1
          test -s apps/archx-agent/docs/Test_Results/Unreleased/visual/linux-conversation-review.png
          xvfb-run -a env ARCHX_SNAPSHOT_PAGE=agent ARCHX_SNAPSHOT_CHAT=conversation-review ARCHX_SNAPSHOT=apps/archx-agent/docs/Test_Results/Unreleased/visual/linux-conversation-default.png ./target/release/archx-ai-lab >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/linux.log 2>&1
          test -s apps/archx-agent/docs/Test_Results/Unreleased/visual/linux-conversation-default.png
          xvfb-run -a env ARCHX_SNAPSHOT_PAGE=agent ARCHX_SNAPSHOT_SIZE=wide ARCHX_SNAPSHOT_CHAT=conversation-review ARCHX_SNAPSHOT_CHAT_SCROLL=end ARCHX_SNAPSHOT=apps/archx-agent/docs/Test_Results/Unreleased/visual/linux-conversation-bottom.png ./target/release/archx-ai-lab >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/linux.log 2>&1
          test -s apps/archx-agent/docs/Test_Results/Unreleased/visual/linux-conversation-bottom.png
          xvfb-run -a env ARCHX_SNAPSHOT_PAGE=settings ARCHX_SNAPSHOT_SIZE=wide ARCHX_SNAPSHOT_SETTINGS=import-review ARCHX_SNAPSHOT=apps/archx-agent/docs/Test_Results/Unreleased/visual/linux-import-review.png ./target/release/archx-ai-lab >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/linux.log 2>&1
          test -s apps/archx-agent/docs/Test_Results/Unreleased/visual/linux-import-review.png
          xvfb-run -a env ARCHX_SNAPSHOT_PAGE=settings ARCHX_SNAPSHOT_SETTINGS=import-verified-review ARCHX_SNAPSHOT=apps/archx-agent/docs/Test_Results/Unreleased/visual/linux-import-verified.png ./target/release/archx-ai-lab >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/linux.log 2>&1
          test -s apps/archx-agent/docs/Test_Results/Unreleased/visual/linux-import-verified.png
          xvfb-run -a env ARCHX_SNAPSHOT_PAGE=settings ARCHX_SNAPSHOT_SIZE=wide ARCHX_SNAPSHOT_SETTINGS=custom-review ARCHX_SNAPSHOT=apps/archx-agent/docs/Test_Results/Unreleased/visual/linux-custom-endpoint.png ./target/release/archx-ai-lab >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/linux.log 2>&1
          test -s apps/archx-agent/docs/Test_Results/Unreleased/visual/linux-custom-endpoint.png
          test -s apps/archx-agent/docs/Test_Results/Unreleased/visual/linux-agent-draft.png
          xvfb-run -a env ARCHX_SNAPSHOT_PAGE=settings ARCHX_SNAPSHOT=apps/archx-agent/docs/Test_Results/Unreleased/visual/linux-settings.png ./target/release/archx-ai-lab >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/linux.log 2>&1
          test -s apps/archx-agent/docs/Test_Results/Unreleased/visual/linux-settings.png
          xvfb-run -a env ARCHX_SNAPSHOT_PAGE=settings ARCHX_SNAPSHOT_SETTINGS=models ARCHX_SNAPSHOT=apps/archx-agent/docs/Test_Results/Unreleased/visual/linux-models.png ./target/release/archx-ai-lab >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/linux.log 2>&1
          test -s apps/archx-agent/docs/Test_Results/Unreleased/visual/linux-models.png
          xvfb-run -a env ARCHX_SNAPSHOT_PAGE=settings ARCHX_SNAPSHOT_SETTINGS=sweep-review ARCHX_SNAPSHOT=apps/archx-agent/docs/Test_Results/Unreleased/visual/linux-sweep.png ./target/release/archx-ai-lab >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/linux.log 2>&1
          test -s apps/archx-agent/docs/Test_Results/Unreleased/visual/linux-sweep.png
          xvfb-run -a env ARCHX_SNAPSHOT_SIDEBAR=collapsed ARCHX_SNAPSHOT=apps/archx-agent/docs/Test_Results/Unreleased/visual/linux-collapsed.png ./target/release/archx-ai-lab >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/linux.log 2>&1
          test -s apps/archx-agent/docs/Test_Results/Unreleased/visual/linux-collapsed.png
          xvfb-run -a env ARCHX_SNAPSHOT_PAGE=agent ARCHX_SNAPSHOT_SIDEBAR=collapsed ARCHX_SNAPSHOT=apps/archx-agent/docs/Test_Results/Unreleased/visual/linux-agent-collapsed.png ./target/release/archx-ai-lab >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/linux.log 2>&1
          test -s apps/archx-agent/docs/Test_Results/Unreleased/visual/linux-agent-collapsed.png
          xvfb-run -a env ARCHX_SNAPSHOT_PAGE=settings ARCHX_SNAPSHOT_SIDEBAR=collapsed ARCHX_SNAPSHOT=apps/archx-agent/docs/Test_Results/Unreleased/visual/linux-settings-collapsed.png ./target/release/archx-ai-lab >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/linux.log 2>&1
          test -s apps/archx-agent/docs/Test_Results/Unreleased/visual/linux-settings-collapsed.png
          xvfb-run -a env ARCHX_SNAPSHOT_PAGE=agent ARCHX_SNAPSHOT_MODE=3 ARCHX_SNAPSHOT=apps/archx-agent/docs/Test_Results/Unreleased/visual/linux-coding.png ./target/release/archx-ai-lab >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/linux.log 2>&1
          test -s apps/archx-agent/docs/Test_Results/Unreleased/visual/linux-coding.png
          xvfb-run -a env ARCHX_SNAPSHOT_PAGE=settings ARCHX_SNAPSHOT_MEMORY=custom ARCHX_SNAPSHOT=apps/archx-agent/docs/Test_Results/Unreleased/visual/linux-custom.png ./target/release/archx-ai-lab >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/linux.log 2>&1
          test -s apps/archx-agent/docs/Test_Results/Unreleased/visual/linux-custom.png
          xvfb-run -a env ARCHX_SNAPSHOT_PAGE=lab-settings ARCHX_SNAPSHOT=apps/archx-agent/docs/Test_Results/Unreleased/visual/linux-lab-settings.png ./target/release/archx-ai-lab >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/linux.log 2>&1
          test -s apps/archx-agent/docs/Test_Results/Unreleased/visual/linux-lab-settings.png
          xvfb-run -a env ARCHX_SNAPSHOT_PAGE=agent ARCHX_SNAPSHOT_SIZE=wide ARCHX_SNAPSHOT_CHAT=cut-off ARCHX_SNAPSHOT=apps/archx-agent/docs/Test_Results/Unreleased/visual/linux-chat-cut-off.png ./target/release/archx-ai-lab >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/linux.log 2>&1
          test -s apps/archx-agent/docs/Test_Results/Unreleased/visual/linux-chat-cut-off.png
      - name: Record results in repository
        if: always()
        continue-on-error: true # Concurrent evidence commits can conflict; never block OS build validation.
        shell: bash
        run: |
          git config user.name 'archx-ci[bot]'
          git config user.email 'archx-ci[bot]@users.noreply.github.com'
          git add -A apps/archx-agent/docs/Test_Results/Unreleased/non_visual/ apps/archx-agent/docs/Test_Results/Unreleased/visual/
          if test -f Cargo.lock; then git add Cargo.lock; fi
          git diff --cached --quiet || (git commit -m 'Record Linux GUI validation' && git pull --rebase origin arena/53d9bc26-archx-agent && git push origin HEAD:arena/53d9bc26-archx-agent)

  windows:
    needs: linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/53d9bc26-archx-agent
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Build, test, and screenshot
        shell: bash
        run: |
          set -o pipefail
          mkdir -p apps/archx-agent/docs/Test_Results/Unreleased/{non_visual,visual} deliverables/Unreleased/windows
          (echo 'COMMAND: cargo test --workspace --locked'; cargo test --workspace --locked && echo 'COMMAND: cargo build --release --locked' && cargo build --release --locked -p archx-ai-lab) > apps/archx-agent/docs/Test_Results/Unreleased/non_visual/windows.log 2>&1
          python -c 'import pathlib,struct; data=pathlib.Path("target/release/archx-ai-lab.exe").read_bytes(); pe=struct.unpack_from("<I",data,0x3c)[0]; subsystem=struct.unpack_from("<H",data,pe+92)[0]; assert subsystem==2, f"Expected GUI subsystem 2, found {subsystem}"; print("PASS: Windows GUI subsystem 2 (no console)")' >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/windows.log 2>&1
          powershell.exe -NoProfile -Command '$info=(Get-Item "target/release/archx-ai-lab.exe").VersionInfo; if ($info.CompanyName -ne "Archnemix" -or $info.ProductName -ne "Archx AI Lab") { throw "Incorrect PE product metadata" }; Write-Output "PASS: Archnemix Windows product metadata (not a digital signature)"' >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/windows.log 2>&1
          ARCHX_SNAPSHOT=apps/archx-agent/docs/Test_Results/Unreleased/visual/windows.png ./target/release/archx-ai-lab.exe >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/windows.log 2>&1
          test -s apps/archx-agent/docs/Test_Results/Unreleased/visual/windows.png
          for phase in 1 3; do
            ARCHX_SNAPSHOT_AGENT_PHASE=$phase ARCHX_SNAPSHOT=apps/archx-agent/docs/Test_Results/Unreleased/visual/windows-agent-phase-$phase.png ./target/release/archx-ai-lab.exe >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/windows.log 2>&1
            test -s apps/archx-agent/docs/Test_Results/Unreleased/visual/windows-agent-phase-$phase.png
            if cmp -s apps/archx-agent/docs/Test_Results/Unreleased/visual/windows.png apps/archx-agent/docs/Test_Results/Unreleased/visual/windows-agent-phase-$phase.png; then echo "FAIL: Windows Agent phase $phase matches rest" >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/windows.log; exit 1; fi
            echo "PASS: Windows Agent phase $phase differs from rest" >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/windows.log
          done
          for phase in 1 2; do
            ARCHX_SNAPSHOT_HOVER=archx-agent ARCHX_SNAPSHOT_PHASE=$phase ARCHX_SNAPSHOT=apps/archx-agent/docs/Test_Results/Unreleased/visual/windows-agent-hover-$phase.png ./target/release/archx-ai-lab.exe >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/windows.log 2>&1
            test -s apps/archx-agent/docs/Test_Results/Unreleased/visual/windows-agent-hover-$phase.png
          done
          if cmp -s apps/archx-agent/docs/Test_Results/Unreleased/visual/windows.png apps/archx-agent/docs/Test_Results/Unreleased/visual/windows-agent-hover-1.png; then echo "FAIL: Windows tile hover matches rest" >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/windows.log; exit 1; fi
          echo "PASS: Windows tile hover differs from rest" >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/windows.log
          ARCHX_SNAPSHOT_PAGE=about ARCHX_SNAPSHOT=apps/archx-agent/docs/Test_Results/Unreleased/visual/windows-about.png ./target/release/archx-ai-lab.exe >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/windows.log 2>&1
          test -s apps/archx-agent/docs/Test_Results/Unreleased/visual/windows-about.png
          ARCHX_SNAPSHOT_PAGE=agent ARCHX_SNAPSHOT=apps/archx-agent/docs/Test_Results/Unreleased/visual/windows-agent.png ./target/release/archx-ai-lab.exe >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/windows.log 2>&1
          test -s apps/archx-agent/docs/Test_Results/Unreleased/visual/windows-agent.png
          ARCHX_SNAPSHOT_PAGE=agent ARCHX_SNAPSHOT_DRAFT='Sketch a new idea for a project' ARCHX_SNAPSHOT=apps/archx-agent/docs/Test_Results/Unreleased/visual/windows-agent-draft.png ./target/release/archx-ai-lab.exe >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/windows.log 2>&1
          ARCHX_SNAPSHOT_PAGE=agent ARCHX_SNAPSHOT_CHAT=reasoning ARCHX_SNAPSHOT=apps/archx-agent/docs/Test_Results/Unreleased/visual/windows-agent-markdown.png ./target/release/archx-ai-lab.exe >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/windows.log 2>&1
          test -s apps/archx-agent/docs/Test_Results/Unreleased/visual/windows-agent-markdown.png
          ARCHX_SNAPSHOT_PAGE=agent ARCHX_SNAPSHOT_SIZE=wide ARCHX_SNAPSHOT_CHAT=reasoning ARCHX_SNAPSHOT=apps/archx-agent/docs/Test_Results/Unreleased/visual/windows-chat-wide.png ./target/release/archx-ai-lab.exe >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/windows.log 2>&1
          ARCHX_SNAPSHOT_PAGE=agent ARCHX_SNAPSHOT_SIZE=wide ARCHX_SNAPSHOT_CHAT=model-menu ARCHX_SNAPSHOT=apps/archx-agent/docs/Test_Results/Unreleased/visual/windows-model-menu.png ./target/release/archx-ai-lab.exe >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/windows.log 2>&1
          test -s apps/archx-agent/docs/Test_Results/Unreleased/visual/windows-chat-wide.png
          test -s apps/archx-agent/docs/Test_Results/Unreleased/visual/windows-model-menu.png
          ARCHX_SNAPSHOT_PAGE=agent ARCHX_SNAPSHOT_SIZE=wide ARCHX_SNAPSHOT_CHAT=review ARCHX_SNAPSHOT=apps/archx-agent/docs/Test_Results/Unreleased/visual/windows-chat-review.png ./target/release/archx-ai-lab.exe >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/windows.log 2>&1
          test -s apps/archx-agent/docs/Test_Results/Unreleased/visual/windows-chat-review.png
          ARCHX_SNAPSHOT_PAGE=agent ARCHX_SNAPSHOT_SIZE=wide ARCHX_SNAPSHOT_CHAT=conversation-review ARCHX_SNAPSHOT=apps/archx-agent/docs/Test_Results/Unreleased/visual/windows-conversation-review.png ./target/release/archx-ai-lab.exe >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/windows.log 2>&1
          test -s apps/archx-agent/docs/Test_Results/Unreleased/visual/windows-conversation-review.png
          ARCHX_SNAPSHOT_PAGE=agent ARCHX_SNAPSHOT_CHAT=conversation-review ARCHX_SNAPSHOT=apps/archx-agent/docs/Test_Results/Unreleased/visual/windows-conversation-default.png ./target/release/archx-ai-lab.exe >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/windows.log 2>&1
          test -s apps/archx-agent/docs/Test_Results/Unreleased/visual/windows-conversation-default.png
          ARCHX_SNAPSHOT_PAGE=agent ARCHX_SNAPSHOT_SIZE=wide ARCHX_SNAPSHOT_CHAT=conversation-review ARCHX_SNAPSHOT_CHAT_SCROLL=end ARCHX_SNAPSHOT=apps/archx-agent/docs/Test_Results/Unreleased/visual/windows-conversation-bottom.png ./target/release/archx-ai-lab.exe >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/windows.log 2>&1
          test -s apps/archx-agent/docs/Test_Results/Unreleased/visual/windows-conversation-bottom.png
          ARCHX_SNAPSHOT_PAGE=settings ARCHX_SNAPSHOT_SIZE=wide ARCHX_SNAPSHOT_SETTINGS=import-review ARCHX_SNAPSHOT=apps/archx-agent/docs/Test_Results/Unreleased/visual/windows-import-review.png ./target/release/archx-ai-lab.exe >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/windows.log 2>&1
          test -s apps/archx-agent/docs/Test_Results/Unreleased/visual/windows-import-review.png
          ARCHX_SNAPSHOT_PAGE=settings ARCHX_SNAPSHOT_SETTINGS=import-verified-review ARCHX_SNAPSHOT=apps/archx-agent/docs/Test_Results/Unreleased/visual/windows-import-verified.png ./target/release/archx-ai-lab.exe >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/windows.log 2>&1
          test -s apps/archx-agent/docs/Test_Results/Unreleased/visual/windows-import-verified.png
          ARCHX_SNAPSHOT_PAGE=settings ARCHX_SNAPSHOT_SIZE=wide ARCHX_SNAPSHOT_SETTINGS=custom-review ARCHX_SNAPSHOT=apps/archx-agent/docs/Test_Results/Unreleased/visual/windows-custom-endpoint.png ./target/release/archx-ai-lab.exe >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/windows.log 2>&1
          test -s apps/archx-agent/docs/Test_Results/Unreleased/visual/windows-custom-endpoint.png
          test -s apps/archx-agent/docs/Test_Results/Unreleased/visual/windows-agent-draft.png
          ARCHX_SNAPSHOT_PAGE=settings ARCHX_SNAPSHOT=apps/archx-agent/docs/Test_Results/Unreleased/visual/windows-settings.png ./target/release/archx-ai-lab.exe >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/windows.log 2>&1
          test -s apps/archx-agent/docs/Test_Results/Unreleased/visual/windows-settings.png
          ARCHX_SNAPSHOT_PAGE=settings ARCHX_SNAPSHOT_SETTINGS=models ARCHX_SNAPSHOT=apps/archx-agent/docs/Test_Results/Unreleased/visual/windows-models.png ./target/release/archx-ai-lab.exe >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/windows.log 2>&1
          test -s apps/archx-agent/docs/Test_Results/Unreleased/visual/windows-models.png
