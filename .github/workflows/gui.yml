          ARCHX_SNAPSHOT=apps/archx-agent/docs/Test_Results/Unreleased/visual/macos.png ./target/release/archx-ai-lab >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/macos.log 2>&1
          test -s apps/archx-agent/docs/Test_Results/Unreleased/visual/macos.png
          for phase in 1 3; do
            ARCHX_SNAPSHOT_AGENT_PHASE=$phase ARCHX_SNAPSHOT=apps/archx-agent/docs/Test_Results/Unreleased/visual/macos-agent-phase-$phase.png ./target/release/archx-ai-lab >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/macos.log 2>&1
            test -s apps/archx-agent/docs/Test_Results/Unreleased/visual/macos-agent-phase-$phase.png
            if cmp -s apps/archx-agent/docs/Test_Results/Unreleased/visual/macos.png apps/archx-agent/docs/Test_Results/Unreleased/visual/macos-agent-phase-$phase.png; then echo "FAIL: macOS Agent phase $phase matches rest" >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/macos.log; exit 1; fi
            echo "PASS: macOS Agent phase $phase differs from rest" >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/macos.log
          done
          for phase in 1 2; do
            ARCHX_SNAPSHOT_HOVER=archx-agent ARCHX_SNAPSHOT_PHASE=$phase ARCHX_SNAPSHOT=apps/archx-agent/docs/Test_Results/Unreleased/visual/macos-agent-hover-$phase.png ./target/release/archx-ai-lab >> apps/archx-agent/docs/Test_Results/Unreleased/non_visual/macos.log 2>&1
            test -s apps/archx-agent/docs/Test_Results/Unreleased/visual/macos-agent-hover-$phase.png
