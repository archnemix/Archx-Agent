# Purpose: Recheck macOS GUI evidence independently when the sequential runner is cancelled in queue.
name: macOS compact-rail recheck

on:
  push:
    branches: [arena/d45bc2a4-archx-agent]
    paths:
      - 'internels/ci-trigger-macos.txt'

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/d45bc2a4-archx-agent
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Build, test, and screenshot compact rail
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Docs/Test_Results/Unreleased/{non_visual,visual}
          (echo 'COMMAND: cargo test --locked'; cargo test --locked; echo 'COMMAND: cargo build --release --locked'; cargo build --release --locked) > Docs/Test_Results/Unreleased/non_visual/macos.log 2>&1
          for page in home agent settings; do
            filename=macos-collapsed.png
            if [[ "$page" != home ]]; then
              filename="macos-$page-collapsed.png"
            fi
            echo "CAPTURE: $page compact rail -> $filename" >> Docs/Test_Results/Unreleased/non_visual/macos.log
            env ARCHX_SNAPSHOT_PAGE="$page" ARCHX_SNAPSHOT_SIDEBAR=collapsed ARCHX_SNAPSHOT="Docs/Test_Results/Unreleased/visual/$filename" ./target/release/archx-ai-lab >> Docs/Test_Results/Unreleased/non_visual/macos.log 2>&1 || { code=$?; echo "FAIL: $page launch exited $code" >> Docs/Test_Results/Unreleased/non_visual/macos.log; exit "$code"; }
            test -s "Docs/Test_Results/Unreleased/visual/$filename" || { echo "FAIL: missing $filename" >> Docs/Test_Results/Unreleased/non_visual/macos.log; exit 1; }
          done
          echo 'CAPTURE: expanded Agent baseline' >> Docs/Test_Results/Unreleased/non_visual/macos.log
          ARCHX_SNAPSHOT_PAGE=agent ARCHX_SNAPSHOT=Docs/Test_Results/Unreleased/visual/macos-agent.png ./target/release/archx-ai-lab >> Docs/Test_Results/Unreleased/non_visual/macos.log 2>&1 || { code=$?; echo "FAIL: expanded Agent launch exited $code" >> Docs/Test_Results/Unreleased/non_visual/macos.log; exit "$code"; }
          test -s Docs/Test_Results/Unreleased/visual/macos-agent.png || { echo 'FAIL: missing expanded Agent PNG' >> Docs/Test_Results/Unreleased/non_visual/macos.log; exit 1; }
      - name: Record macOS evidence in repository
        if: always()
        shell: bash
        run: |
          git config user.name 'archx-ci[bot]'
          git config user.email 'archx-ci[bot]@users.noreply.github.com'
          git add -A Docs/Test_Results/Unreleased/non_visual/ Docs/Test_Results/Unreleased/visual/
          git diff --cached --quiet || (git commit -m 'Record independent macOS compact-rail validation' && git push origin HEAD:arena/d45bc2a4-archx-agent)
