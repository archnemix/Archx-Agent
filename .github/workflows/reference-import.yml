# Purpose: Fetch the public user-supplied web-app reference for inspection, without executing its code or committing an unreviewed archive.
name: Inspect web app reference
on:
  push:
    branches: [arena/53d9bc26-archx-agent]
    paths: ['.github/workflows/reference-import.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/53d9bc26-archx-agent
          persist-credentials: true
      - name: Download and inspect archive metadata
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 300 --silent --show-error \
            'https://drive.usercontent.google.com/download?id=1zmn-G781kvJ3yRjmm8ENaCW4H7Wpz945&export=download&confirm=t' \
            -o /tmp/web-app-reference.tar
          file /tmp/web-app-reference.tar
          du -h /tmp/web-app-reference.tar
          sha256sum /tmp/web-app-reference.tar
          test "$(stat -c %s /tmp/web-app-reference.tar)" -lt 104857600
          tar -tf /tmp/web-app-reference.tar > /tmp/reference-file-list.txt
          echo "Archive contains $(wc -l < /tmp/reference-file-list.txt) entries"
          head -40 /tmp/reference-file-list.txt
          mkdir -p internels/reference/web
          { sha256sum /tmp/web-app-reference.tar; du -h /tmp/web-app-reference.tar; cat /tmp/reference-file-list.txt; } > internels/reference/web/archive-inventory.txt
          python3 - <<'PY'
          import tarfile
          from pathlib import PurePosixPath
          with tarfile.open('/tmp/web-app-reference.tar') as archive:
              for member in archive:
                  path = PurePosixPath(member.name)
                  assert path.parts[0] == 'archx-agent' and '..' not in path.parts and not path.is_absolute(), member.name
                  assert member.isfile() or member.isdir(), member.name
                  assert member.size < 2_000_000, member.name
                  assert not any(part.startswith('.env') or part in ('.git', 'node_modules', 'id_rsa') for part in path.parts), member.name
              archive.extractall('internels/reference/web', filter='data')
          PY
          cp /tmp/web-app-reference.tar internels/reference/web/archx-agent-reference.tar
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internels/reference/web
          git commit -m 'Import inspected web-app reference source and tar'
          git push origin HEAD:arena/53d9bc26-archx-agent
      - uses: actions/upload-artifact@v4
        with:
          name: web-app-reference-tar
          path: /tmp/web-app-reference.tar
          retention-days: 3
          if-no-files-found: error
