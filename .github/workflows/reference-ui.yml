name: inspect user UI reference
on:
  push:
    branches: [arena/79ddb5b4-archx-agent]
    paths:
      - .github/workflows/reference-ui.yml
      - scripts/retrieve_reference_ui.py
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  inspect:
    if: github.ref == 'refs/heads/arena/79ddb5b4-archx-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Stop unrelated model run accidentally triggered by the source checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/archnemix/Archx-Agent/actions/runs/41201959418/cancel
        continue-on-error: true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install retrieval tool only
        run: python -m pip install gdown==5.2.0
      - name: Download and inspect without executing the reference
        run: python scripts/retrieve_reference_ui.py "$RUNNER_TEMP/reference-download" .reference-review
      - name: Return bounded inspection results on the same session branch
        if: always()
        run: |
          test -f .reference-review/report.json || exit 0
          git config user.name 'Archx reference retrieval'
          git config user.email 'reference-retrieval@users.noreply.github.com'
          git add .reference-review
          git diff --cached --quiet && exit 0
          git commit -m 'Return bounded UI reference inspection [skip ci]'
          git push origin HEAD:arena/79ddb5b4-archx-agent
