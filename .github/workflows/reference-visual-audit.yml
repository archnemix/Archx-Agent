# Purpose: Capture the original 1.9.0 browser UI for a controlled visual audit; never ship it in the native binary.
name: Reference 1.9.0 visual audit
on:
  workflow_dispatch:
  push:
    branches: [arena/d45bc2a4-archx-agent]
    paths:
      - '.github/workflows/reference-visual-audit.yml'
      - 'scripts/capture-reference.cjs'
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/d45bc2a4-archx-agent
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare isolated reference and browser
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Docs/Test_Results/Unreleased/reference
          (cd internels/reference/web/archx-agent &&
            npm ci --ignore-scripts --no-audit --no-fund &&
            npm install --prefix "$RUNNER_TEMP/capture" --no-audit --no-fund playwright@1.65.1 &&
            "$RUNNER_TEMP/capture/node_modules/.bin/playwright" install chromium) > Docs/Test_Results/Unreleased/reference/prepare.log 2>&1 || {
              tail -80 Docs/Test_Results/Unreleased/reference/prepare.log
              exit 1
            }
          rm Docs/Test_Results/Unreleased/reference/prepare.log
      - name: Capture original web UI at native screenshot size
        shell: bash
        run: |
          set -euo pipefail
          cd internels/reference/web/archx-agent
          node bin/archx-agent.js webui --no-open --no-store --host 127.0.0.1 --port 4187 > "$RUNNER_TEMP/reference.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; cat "$RUNNER_TEMP/reference.log"' EXIT
          CAPTURE_MODULE="$RUNNER_TEMP/capture/node_modules/playwright" node ../../../../scripts/capture-reference.cjs > ../../../../Docs/Test_Results/Unreleased/reference/capture.log 2>&1 || {
            tail -80 ../../../../Docs/Test_Results/Unreleased/reference/capture.log
            exit 1
          }
          rm ../../../../Docs/Test_Results/Unreleased/reference/capture.log
          test -s ../../../../Docs/Test_Results/Unreleased/reference/reference-chat-1280.png
          test -s ../../../../Docs/Test_Results/Unreleased/reference/reference-models-1280.png
          test -s ../../../../Docs/Test_Results/Unreleased/reference/reference-import-fixture-1280.png
      - name: Preserve setup diagnosis if the capture failed
        if: failure()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for log in prepare.log capture.log; do
            if test -f "Docs/Test_Results/Unreleased/reference/$log"; then git add "Docs/Test_Results/Unreleased/reference/$log"; fi
          done
          git diff --cached --quiet || (git commit -m 'Record browser reference capture diagnosis' && git push origin arena/d45bc2a4-archx-agent)
      - name: Commit unmodified browser captures
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Docs/Test_Results/Unreleased/reference/
          git diff --cached --quiet || (git commit -m 'Capture isolated 1.9.0 browser reference for visual audit' && git push origin arena/d45bc2a4-archx-agent)
