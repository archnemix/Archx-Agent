name: Node baseline
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      preview:
        description: Start the private real-model preview
        type: boolean
        default: false
      minutes:
        description: Preview duration, 10–90 minutes
        type: string
        default: '90' 
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm pack --dry-run

  model-preview:
    if: github.event_name == 'workflow_dispatch' && inputs.preview
    uses: ./.github/workflows/model-preview.yml
    with:
      minutes: ${{ inputs.minutes }}
