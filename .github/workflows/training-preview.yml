# Purpose: Compiles, tests, screenshots, and packages the standalone Archx Training Studio executable on Linux and Windows.
name: Training Studio Standalone Build & GUI Review

on:
  push:
    branches: [arena/0cc2c3bf-archx-agent]
    paths:
      - 'apps/training/src/**'
      - 'apps/training/Cargo.toml'
      - 'apps/training/build.rs'
      - 'apps/training/app.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/training-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/0cc2c3bf-archx-agent
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test workspace, build standalone binary, and capture stage screenshots
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libasound2-dev xvfb mesa-vulkan-drivers > /dev/null
          mkdir -p apps/training/docs/Test_Results/{non_visual,visual}
          (
            echo 'COMMAND: cargo update --workspace'
            cargo update --workspace
            echo 'COMMAND: cargo test --workspace --locked'
            cargo test --workspace --locked
            echo 'COMMAND: CARGO_PROFILE_RELEASE_STRIP=symbols cargo build --release --locked -p archx-training --bin archx-training'
            CARGO_PROFILE_RELEASE_STRIP=symbols cargo build --release --locked -p archx-training --bin archx-training
          ) > apps/training/docs/Test_Results/non_visual/linux-slice2.log 2>&1

          for pair in \
            "01-data:pipeline:data" \
            "02-tokenizer:pipeline:tokenizer" \
            "03-architecture:pipeline:architecture" \
            "04-hardware:pipeline:hardware" \
            "05-genesis:pipeline:repro" \
            "06-train:pipeline:train" \
            "playground:playground:train" \
            "neural:neural:train"; do
            IFS=":" read -r slug surf stg <<< "$pair"
            out="apps/training/docs/Test_Results/visual/linux-${slug}.png"
            xvfb-run -a env \
              ARCHX_SNAPSHOT_SIZE=wide \
              ARCHX_TRAINING_SURFACE="$surf" \
              ARCHX_TRAINING_STAGE="$stg" \
              ARCHX_SNAPSHOT="$out" \
              ./target/release/archx-training >> apps/training/docs/Test_Results/non_visual/linux-slice2.log 2>&1
            test -s "$out"
          done
      - name: Commit Linux test logs and screenshots
        shell: bash
        run: |
          git config user.name 'archx-ci[bot]'
          git config user.email 'archx-ci[bot]@users.noreply.github.com'
          git add -A apps/training/docs/Test_Results/
          if test -f Cargo.lock; then git add Cargo.lock; fi
          git diff --cached --quiet || (git commit -m 'Record Training Studio Slice #2 Linux tests & screenshots' && git pull --rebase origin arena/0cc2c3bf-archx-agent && git push origin HEAD:arena/0cc2c3bf-archx-agent)

  windows:
    needs: linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/0cc2c3bf-archx-agent
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build standalone Windows archx-training.exe, verify GUI subsystem, and capture screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/training/docs/Test_Results/{non_visual,visual} apps/training/deliverables/windows
          (
            echo 'COMMAND: cargo update --workspace'
            cargo update --workspace
            echo 'COMMAND: cargo test -p archx-training --locked'
            cargo test -p archx-training --locked
            echo 'COMMAND: CARGO_PROFILE_RELEASE_STRIP=symbols cargo build --release --locked -p archx-training --bin archx-training'
            CARGO_PROFILE_RELEASE_STRIP=symbols cargo build --release --locked -p archx-training --bin archx-training
          ) > apps/training/docs/Test_Results/non_visual/windows-slice2.log 2>&1

          python -c 'import pathlib,struct; data=pathlib.Path("target/release/archx-training.exe").read_bytes(); pe=struct.unpack_from("<I",data,0x3c)[0]; subsystem=struct.unpack_from("<H",data,pe+92)[0]; assert subsystem==2, f"Expected GUI subsystem 2, found {subsystem}"; print("PASS: Windows GUI subsystem 2 (no console)")' >> apps/training/docs/Test_Results/non_visual/windows-slice2.log 2>&1
          powershell.exe -NoProfile -Command '$info=(Get-Item "target/release/archx-training.exe").VersionInfo; if ($info.CompanyName -ne "Archnemix" -or $info.ProductName -ne "Archx AI Lab - Model Training") { throw "Incorrect PE product metadata: $($info.CompanyName) / $($info.ProductName)" }; Write-Output "PASS: Archnemix Windows product metadata verified"' >> apps/training/docs/Test_Results/non_visual/windows-slice2.log 2>&1

          for pair in \
            "02-tokenizer:pipeline:tokenizer" \
            "04-hardware:pipeline:hardware" \
            "05-genesis:pipeline:repro" \
            "06-train:pipeline:train"; do
            IFS=":" read -r slug surf stg <<< "$pair"
            out="apps/training/docs/Test_Results/visual/windows-${slug}.png"
            ARCHX_SNAPSHOT_SIZE=wide \
              ARCHX_TRAINING_SURFACE="$surf" \
              ARCHX_TRAINING_STAGE="$stg" \
              ARCHX_SNAPSHOT="$out" \
              ./target/release/archx-training.exe >> apps/training/docs/Test_Results/non_visual/windows-slice2.log 2>&1
            test -s "$out"
          done

          cp target/release/archx-training.exe apps/training/deliverables/windows/archx-training.exe
          sha256sum apps/training/deliverables/windows/archx-training.exe > apps/training/deliverables/windows/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: archx-training-windows-exe
          path: |
            apps/training/deliverables/windows/archx-training.exe
            apps/training/deliverables/windows/SHA256SUMS.txt
      - name: Commit Windows executable and visual validation
        shell: bash
        run: |
          git config user.name 'archx-ci[bot]'
          git config user.email 'archx-ci[bot]@users.noreply.github.com'
          git add -A apps/training/docs/Test_Results/ apps/training/deliverables/windows/
          git diff --cached --quiet || (git commit -m 'Publish standalone Windows archx-training.exe and Slice #2 Windows screenshots' && git pull --rebase origin arena/0cc2c3bf-archx-agent && git push origin HEAD:arena/0cc2c3bf-archx-agent)
