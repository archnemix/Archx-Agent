# Purpose: Declares the native Archx AI Lab desktop application and its GUI/screenshot dependencies.
[package]
name = "archx-ai-lab"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
iced = { version = "0.14.0", features = ["tokio", "image", "svg"] }
image = { version = "0.25", default-features = false, features = ["png"] }
keyring = { version = "4.2", default-features = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }
zeroize = "1.8"

[target.'cfg(windows)'.build-dependencies]
tauri-winres = "0.3.7"
