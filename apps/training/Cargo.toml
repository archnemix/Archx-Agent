# Purpose: Declares the Model Training library crate (`archx-training`) hosted in-process by Archx AI Lab.
[package]
name = "archx-training"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "archx_training"
path = "src/lib.rs"

[dependencies]
archx-shared = { path = "../../shared" }
candle-core = "0.11.1"
candle-nn = "0.11.1"
iced = { version = "0.14.0", features = ["tokio", "image", "svg", "markdown", "sipper"] }
rayon = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
safetensors = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.23.1", default-features = false, features = ["fancy-regex"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time"] }
zeroize = "1.8"
