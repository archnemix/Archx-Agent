# Purpose: Model Training app manifest. Code and docs for this app live in this folder; the launcher only reads this file.
#
# This app is intentionally code-less and UNREGISTERED: `ready = false`, no
# `crate`. That is a valid manifest, and the launcher ignores it completely — no
# tile, no rail entry, no build. That is what lets it be built here without
# disturbing the launcher or the Agent.
#
# When its code lands: add `Cargo.toml`, `crate`, `entry` and `view`, add
# `"apps/training"` to the root `Cargo.toml` members, then flip `ready = true` and
# `status = "live"`. That member line must be added in the SAME commit as
# `apps/training/Cargo.toml`: a member that does not exist on disk fails the whole
# workspace manifest, for every crate including the launcher's. Hosting in the
# launcher's `HOSTED` table and the release line stay the launcher owner's, and
# are added after the app is confirmed to work. Read
# `docs/Registration_Answers.md` first.

id = "training"
name = "Model Training"
category = "BUILD MODELS"
summary = "Design a dataset, train a small model, then evaluate it before it leaves the lab. Code for this app is being built here."
ready = false
status = "building"
art = "workbench"
modes = ["DESIGN", "TRAIN", "EVALUATE", "SHIP"]
docs = "docs"
requires = ["archx-shared"]
