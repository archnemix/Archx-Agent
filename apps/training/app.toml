# Purpose: Model Training app manifest declaring the native Rust model-creation workspace for Archx AI Lab.
#
# While active vertical slices are under CI verification on this branch, `ready`
# stays `false` so the launcher remains untouched until final import readiness.

id = "training"
name = "Model Training"
category = "BUILD MODELS"
summary = "Create and train new models from scratch in native Rust—from dataset and tokenizer to live telemetry and instant post-training chat."
ready = false
status = "building"
art = "workbench"
modes = ["DATA", "TOKENIZER", "ARCHITECT", "TRAIN", "NEURAL", "PLAYGROUND"]
crate = "archx-training"
entry = "src/lib.rs"
view = "home::view"
docs = "docs"
requires = ["archx-shared"]
